[package]
name = "atlas-codecs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ClickHouse-style composable column codecs for KV cache (experiment)"

[dependencies]
lz4_flex = { version = "0.11", default-features = false }
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true

[[bench]]
name = "bench_codec"
harness = false
