syntax = "proto3";
package atlas.kv_cache;

service KvCache {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Remove (RemoveRequest) returns (RemoveResponse);
}

message PutRequest {
  string key = 1;
  bytes block = 2;
  bool allow_spill = 3;
}

message PutResponse {}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes block = 1;
  bool from_nvme = 2;
}

message RemoveRequest {
  string key = 1;
}

message RemoveResponse {}
