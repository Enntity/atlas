[package]
name = "glm-pair-guard"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
libc = "=0.2.189"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
